server {
    listen 80;
    server_name weather.nuu.uz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name weather.nuu.uz;
    ssl_certificate     /etc/letsencrypt/live/weather.nuu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.nuu.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/weather-frontend-new;
    index index.html;

    # Device firmware ingest — the two deployed ESP32 sketches (Room/Street
    # LAST.ino) POST straight to /api/room and /api/street (no /v1/, no
    # /latest — that's the old Python backend's exact shape, hardcoded in
    # firmware already flashed to the boards). Without this pair of exact
    # locations these requests fell through to the SPA's `location /` and
    # got back index.html instead of ever reaching the API — which is why
    # devices reported the server "not accepting" their data.
    location = /api/room {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New Fastify API (apps/api) — port 8002. Public path stays /api/ for
    # the frontend; only the internal routing target changed from the old
    # Python backend (8001, /api/room/latest style) to this one's /v1/
    # routes. Legacy-shaped paths are mapped 1:1 so the already-deployed
    # frontend build's hardcoded ENV.endpoints keep working.
    location = /api/room/latest {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/room/all {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room/history;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street/latest {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street/all {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street/history;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket live push — needs the Upgrade/Connection headers a plain
    # proxy_pass doesn't send.
    location = /api/v1/ws/sensors {
        proxy_pass http://127.0.0.1:8002/v1/ws/sensors;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else under /api/v1/ (export, health, future routes) —
    # strips the /api prefix, forwards the rest as-is to the new backend.
    location ^~ /api/v1/ {
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8002/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
