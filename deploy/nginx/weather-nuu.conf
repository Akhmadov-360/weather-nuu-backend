server {
    listen 80;
    server_name weather.nuu.uz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name weather.nuu.uz;
    ssl_certificate     /etc/letsencrypt/live/weather.nuu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.nuu.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/weather-frontend-new;
    index index.html;

    # Device firmware ingest — the two deployed ESP32 sketches (Room/Street
    # LAST.ino) POST straight to /api/room and /api/street (no /v1/, no
    # /latest — that's the old Python backend's exact shape, hardcoded in
    # firmware already flashed to the boards). Without this pair of exact
    # locations these requests fell through to the SPA's `location /` and
    # got back index.html instead of ever reaching the API — which is why
    # devices reported the server "not accepting" their data.
    location = /api/room {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New Fastify API (apps/api) — port 8002. Public path stays /api/ for
    # the frontend; only the internal routing target changed from the old
    # Python backend (8001, /api/room/latest style) to this one's /v1/
    # routes. Legacy-shaped paths are mapped 1:1 so the already-deployed
    # frontend build's hardcoded ENV.endpoints keep working.
    location = /api/room/latest {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/room/all {
        proxy_pass http://127.0.0.1:8002/v1/sensors/room/history;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street/latest {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street/latest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/street/all {
        proxy_pass http://127.0.0.1:8002/v1/sensors/street/history;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket live push — needs the Upgrade/Connection headers a plain
    # proxy_pass doesn't send.
    location = /api/v1/ws/sensors {
        proxy_pass http://127.0.0.1:8002/v1/ws/sensors;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The assistant's answer is a stream (server-sent events): nginx must not collect it into one
    # piece, and a silent stream (the model is thinking) must not be cut. The API sends a `: ping`
    # comment every 15 s; the timeout is wider than that. X-Real-IP is what the API's rate limit
    # counts by, so it is set here from the real address, never taken from the visitor.
    location ^~ /api/v1/assistant/ {
        proxy_pass http://127.0.0.1:8002/v1/assistant/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api/v1/ (export, health, future routes) —
    # strips the /api prefix, forwards the rest as-is to the new backend.
    location ^~ /api/v1/ {
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8002/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compression: the http-level gzip_types list has no CSS or SVG. A `gzip_types`
    # set here replaces (does not extend) the inherited one, so the list is complete.
    gzip_types text/plain text/csv text/css application/json application/javascript image/svg+xml;

    # Vite writes a content hash into every file name under /assets/, so a file
    # never changes under the same name and can be cached for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The pages of the app. The frontend build writes one file for every address (room.html, street.html, map.html,
    # analytics.html) with its own title, description, address and social card, so that a search engine or a social
    # network gets the right tags without running the application; the browser then starts the app as before.
    # The browser must re-check these files on every visit: they name the current hashed files of /assets/, and a stale
    # copy would point at files that a deploy has removed.
    location = /room      { add_header Cache-Control "no-cache"; try_files /room.html =404; }
    location = /street    { add_header Cache-Control "no-cache"; try_files /street.html =404; }
    location = /map       { add_header Cache-Control "no-cache"; try_files /map.html =404; }
    location = /analytics { add_header Cache-Control "no-cache"; try_files /analytics.html =404; }
    # One address for one page: the closing slash and the empty address lead to the room page.
    location ~ ^/(room|street|map|analytics)/$ { return 301 /$1; }
    location = / { return 301 /room; }
    location = /index.html { return 301 /room; }

    # For the crawlers: the sitemap and the rules are real files, never the application.
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; try_files /sitemap.xml =404; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; try_files /robots.txt =404; }

    # Files of the site (icons, the social card). An address that is not a file and not a page is a 404 with the
    # status 404: an application that answers 200 on every address makes the search engines index pages that do not exist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
