name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Версия pnpm берётся из поля packageManager в package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and use their own `weather_test` database on this server.
      TEST_DATABASE_URL: postgres://weather:weather@localhost:5432/weather_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  stack-smoke:
    name: Local stack starts and answers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db + api (migrations and seed run on start)
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180
      - name: Health and data endpoints respond
        run: |
          curl -fsS http://localhost:8002/v1/health
          curl -fsS http://localhost:8002/v1/sensors/room/latest
          curl -fsS "http://localhost:8002/v1/sensors/street/history?limit=3"
      - name: Show API logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs api
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
